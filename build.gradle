plugins {
    id "java"
    id "application"
    id "org.wpilib.GradleRIO" version "2027.0.0-alpha-8"
    id "com.peterabeles.gversion" version "1.11.0"
    id "io.freefair.lombok" version "9.8.3"
    id "net.ltgt.errorprone" version "5.2.0"
    id 'com.diffplug.spotless' version '8.11.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"
def flatbuffersVersion = "25.2.10"
def flatbuffersSchemaDir = file("C2/schema")
def flatbuffersGeneratedSourceDir = file("src/main/generated/flatbuffers/java")
def flatbuffersToolDir = layout.buildDirectory.dir("flatbuffers/tooling").get().asFile

def isWindows = {
    System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("win")
}

def findFlatcOnPath = {
    def lookup = providers.exec {
        commandLine(isWindows() ? ["where", "flatc"] : ["which", "flatc"])
        ignoreExitValue = true
    }

    if (lookup.result.get().exitValue != 0) {
        return null
    }

    return lookup.standardOutput.asText.get()
            .readLines()
            .collect { it.trim() }
            .find { !it.isEmpty() }
}

def flatcBinaryName = {
    isWindows() ? "flatc.exe" : "flatc"
}

def flatcArchiveName = {
    def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
    def arch = System.getProperty("os.arch").toLowerCase(Locale.ROOT)

    if (osName.contains("mac")) {
        return arch.contains("aarch64") || arch.contains("arm") ? "Mac.flatc.binary.zip" : "MacIntel.flatc.binary.zip"
    }
    if (osName.contains("win")) {
        return "Windows.flatc.binary.zip"
    }
    if (osName.contains("linux")) {
        return "Linux.flatc.binary.g++-13.zip"
    }

    throw new GradleException("Unsupported operating system for FlatBuffers code generation: ${System.getProperty("os.name")} (${System.getProperty("os.arch")})")
}

def downloadFlatc = {
    try {
        def archiveFile = file("$flatbuffersToolDir/${flatcArchiveName()}")
        def extractDir = file("$flatbuffersToolDir/${flatcArchiveName() - '.zip'}")

        flatbuffersToolDir.mkdirs()

        def flatcExecutable = fileTree(extractDir).matching {
            include flatcBinaryName()
            include "**/${flatcBinaryName()}"
        }.files.find()

        if (flatcExecutable == null) {
            if (!archiveFile.exists()) {
                def downloadUrl = "https://github.com/google/flatbuffers/releases/download/v${flatbuffersVersion}/${flatcArchiveName()}"
                logger.lifecycle("Downloading FlatBuffers compiler from ${downloadUrl}")
                new URL(downloadUrl).withInputStream { input ->
                    archiveFile.withOutputStream { output ->
                        output << input
                    }
                }
            }

            copy {
                from zipTree(archiveFile)
                into extractDir
            }

            flatcExecutable = fileTree(extractDir).matching {
                include flatcBinaryName()
                include "**/${flatcBinaryName()}"
            }.files.find()
        }

        if (flatcExecutable == null) {
            throw new GradleException("Unable to locate ${flatcBinaryName()} after extracting ${archiveFile.name}")
        }

        if (!isWindows()) {
            flatcExecutable.setExecutable(true)
        }

        return flatcExecutable.absolutePath
    } catch (Exception ex) {
        logger.warn("Unable to download or extract FlatBuffers compiler automatically; using existing generated sources in ${flatbuffersGeneratedSourceDir}.")
        def message = ex.message?.trim()
        if (message) {
            logger.warn(message)
        }
        return null
    }
}

def sanitizeGeneratedFlatbufferSources = { File sourceRoot ->
    fileTree(sourceRoot).matching { include "**/*.java" }.files.each { generatedFile ->
        def generatedSource = generatedFile.getText("UTF-8")
        def sanitizedSource = generatedSource.replaceAll(
                /(?m)^  public static void ValidateVersion\(\) \{ Constants\.FLATBUFFERS_[0-9_]+\(\); \}\r?\n/,
                ""
        )

        if (sanitizedSource != generatedSource) {
            generatedFile.write(sanitizedSource, "UTF-8")
        }
    }
}

sourceSets {
    main {
        java.srcDir flatbuffersGeneratedSourceDir
    }
}

tasks.register("generateFlatbuffers") {
    description = "Refreshes existing Java sources from FlatBuffers schemas when flatc is available."
    group = "build"

    inputs.files(fileTree(flatbuffersSchemaDir).matching { include "**/*.fbs" })
    outputs.dir(flatbuffersGeneratedSourceDir)

    doLast {
        def schemaFiles = fileTree(flatbuffersSchemaDir).matching { include "**/*.fbs" }.files.toList().sort()
        if (schemaFiles.isEmpty()) {
            logger.warn("No FlatBuffers schemas found in ${flatbuffersSchemaDir}; using existing generated sources in ${flatbuffersGeneratedSourceDir}.")
            return
        }

        def flatcPath = providers.gradleProperty("flatcPath").orNull ?: findFlatcOnPath()
        if (flatcPath == null) {
            flatcPath = downloadFlatc()
        }
        if (flatcPath == null) {
            logger.warn("FlatBuffers compiler unavailable after PATH lookup and download attempt; using existing generated sources in ${flatbuffersGeneratedSourceDir}. Set -PflatcPath=/path/to/flatc to refresh them explicitly.")
            return
        }
        logger.lifecycle("Generating FlatBuffers Java sources with ${flatcPath}")

        def tempOutputDir = layout.buildDirectory.dir("generated/sources/flatbuffers/java/main").get().asFile
        delete(tempOutputDir)
        tempOutputDir.mkdirs()

        def flatcRun = providers.exec {
            commandLine([
                flatcPath,
                "--java",
                "-I", flatbuffersSchemaDir.absolutePath,
                "-o", tempOutputDir.absolutePath,
            ] + schemaFiles.collect { it.absolutePath })
            ignoreExitValue = true
        }
        def result = flatcRun.result.get()

        if (result.exitValue != 0) {
            logger.warn("FlatBuffers code generation failed with exit code ${result.exitValue}; using existing generated sources in ${flatbuffersGeneratedSourceDir}.")
            def commandOutput = flatcRun.standardError.asText.get().trim()
            if (!commandOutput.isEmpty()) {
                logger.warn(commandOutput)
            }
            return
        }

        sanitizeGeneratedFlatbufferSources(tempOutputDir)

        delete(flatbuffersGeneratedSourceDir)
        copy {
            from tempOutputDir
            into flatbuffersGeneratedSourceDir
        }
    }
}

// Define my targets (SystemCore) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        systemcore(getTargetTypeClass('SystemCore')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.wpilib.getTeamNumber()
            // Use the default systemcore host name. This must be called after setting team
            // as happens on the line above
            useDefaultSystemcoreHostName()
            debug = project.wpilib.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                wpilibJava(getArtifactTypeClass('WPILibJavaArtifact')) {
                    // Set to true to use debug including JNI, which will drastically impact performance.
                    debugJni = false
                }

                // Static files artifact
                wpilibStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/systemcore/deploy'
                    // Change to true to delete files on systemcore that no
                    // longer exist in deploy directory of this project
                    deleteOldFiles = true
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.systemcore.artifacts.wpilibJava

// Set to true to use debug for simulation including JNI
wpi.java.runSimWithDebugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Configuration for AdvantageKit
tasks.register("replayWatch", JavaExec) {
    mainClass = "org.littletonrobotics.junction.ReplayWatch"
    classpath = sourceSets.main.runtimeClasspath
}

repositories {
    mavenCentral()
}

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 4.
dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()

    errorprone("com.google.errorprone:error_prone_core:2.52.0")

    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    systemcoreDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.systemcore)
    systemcoreDebug wpi.java.vendor.jniDebug(wpi.platforms.systemcore)

    systemcoreRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.systemcore)
    systemcoreRelease wpi.java.vendor.jniRelease(wpi.platforms.systemcore)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    def akitJson = new groovy.json.JsonSlurper().parseText(new File(projectDir.getAbsolutePath() + "/vendordeps/AdvantageKit.json").text)
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:$akitJson.version"

    compileOnly 'com.google.errorprone:error_prone_annotations:2.52.0'

    implementation "org.apache.commons:commons-lang3:3.18.0"

    // WPILib 2027 no longer bundles Jackson; used for AprilTag layout parsing and Elastic notifications
    implementation "com.fasterxml.jackson.core:jackson-databind:2.20.1"

    implementation "com.google.flatbuffers:flatbuffers-java:${flatbuffersVersion}"
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    // Unit tests always use the physics sim, regardless of Constants.simMode
    systemProperty 'robot.forceSim', 'true'
}

// Simulation configuration (e.g. environment variables).
//
// The sim GUI is *disabled* by default to support running
// AdvantageKit log replay from the command line. Set the
// value to "true" to enable the sim GUI by default (this
// is the standard WPILib behavior).
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

application.mainClass = ROBOT_MAIN_CLASS

deployArtifact.configureApplication(application)
wpi.java.configureApplication(application)
wpi.java.configureTestTasks(test)

jar {
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
}

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone.disableWarningsInGeneratedCode = true
    options.errorprone.excludedPaths =
            ".*/(build/generated|src/main/generated/flatbuffers/java|src/main/java/frc/robot/generated)/.*"

    // Errorprone bug workaround
    options.errorprone.disable("UnusedVariable")
    options.errorprone.disable("Unused")
}

// Create version file
project.compileJava.dependsOn(createVersionFile)
project.compileJava.dependsOn("generateFlatbuffers")
project.compileJava.dependsOn("spotlessApply")
tasks.named("delombok").configure {
    dependsOn(tasks.named("generateFlatbuffers"))
}
gversion {
    srcDir       = "src/main/java/"
    classPackage = "frc.robot"
    className    = "BuildConstants"
    dateFormat   = "yyyy-MM-dd HH:mm:ss z"
    timeZone     = "America/New_York"
    indent       = "  "
}

// Create commit with working changes on event branches
tasks.register("eventDeploy") {
    doLast {
        if (project.gradle.startParameter.taskNames.any({ it.toLowerCase().contains("deploy") })) {
            def branchPrefix = "event"
            def branch = providers.exec {
                workingDir(projectDir)
                commandLine 'git', 'branch', '--show-current'
            }.standardOutput.asText.get().trim()
            def commitMessage = "Update at '${new Date().toString()}'"

            if (branch.startsWith(branchPrefix)) {
                providers.exec {
                    workingDir(projectDir)
                    commandLine 'git', 'add', '-A'
                }.result.get()
                providers.exec {
                    workingDir(projectDir)
                    commandLine 'git', 'commit', '-m', commitMessage
                    ignoreExitValue = true
                }.result.get()

                println "Committed to branch: '$branch'"
                println "Commit message: '$commitMessage'"
            } else {
                println "Not on an event branch, skipping commit"
            }
        } else {
            println "Not running deploy task, skipping commit"
        }
    }
}
createVersionFile.dependsOn(eventDeploy)

// Configure javadoc task to use delombok source and fail on errors
javadoc {
    dependsOn delombok
    source = delombok
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
    failOnError = true
    options.stylesheetFile = new File(projectDir, "theme.css")
}

def spotlessKotlinTargets = files(
    fileTree("src/main/kotlin") { include "**/*.kt" },
    fileTree("src/test/kotlin") { include "**/*.kt" }
)

spotless {
    // Configuration for Java files
    java {
        // Target all Java files
        target '**/*.java'
        targetExclude '**/generated/**', 'third_party/**', 'C2/**'
        googleJavaFormat().reorderImports(true).aosp()
        trimTrailingWhitespace()
        endWithNewline()
    }

    // Only register Kotlin formatting when the repo has Kotlin source roots.
    if (!spotlessKotlinTargets.isEmpty()) {
        kotlin {
            target spotlessKotlinTargets
            ktlint()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    // Configuration for miscellaneous files (e.g., Gradle files, Markdown)
    format 'misc', {
        target '**/*.gradle', '**/*.md', '**/.gitignore'
        targetExclude 'third_party/**', 'C2/**'
        leadingTabsToSpaces()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named("spotlessMisc").configure {
    mustRunAfter(tasks.named("generateFlatbuffers"))
}
